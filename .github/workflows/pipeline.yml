name: Pipeline

run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('main — {0}', github.event.head_commit.message) }}

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt
      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo '### ❌ Formatting drift detected' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'The following files would be modified by `deno fmt`:' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            git diff | head -200 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Summary
        if: success()
        run: |
          {
            echo '### ✅ Formatting clean'
            echo ''
            echo '`deno fmt` produced no changes.'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          if deno lint 2>&1 | tee lint.out; then
            files=$(grep -c "^Checked" lint.out || echo 0)
            {
              echo '### ✅ Lint clean'
              echo ''
              echo "$(tail -1 lint.out)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### ❌ Lint failed'
              echo ''
              echo '```'
              cat lint.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile
        id: build
        run: |
          set -o pipefail
          if deno task build 2>&1 | tee build.out; then
            size=""
            if [ -f coach ]; then
              size=$(du -h coach | cut -f1)
            fi
            {
              echo '### ✅ Build succeeded'
              echo ''
              echo '| Metric | Value |'
              echo '| --- | --- |'
              echo "| Binary | \`coach\` |"
              if [ -n "$size" ]; then echo "| Size   | $size |"; fi
              echo "| Deno   | $(deno --version | head -1) |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### ❌ Build failed'
              echo ''
              echo '```'
              tail -50 build.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run tests
        id: test
        run: |
          set -o pipefail
          if deno task test 2>&1 | tee test.out; then
            # deno test summary line: "ok | N passed | M failed (Xs)"
            summary=$(grep -E "^(ok|FAILED) \|" test.out | tail -1)
            passed=$(echo "$summary" | grep -oE '[0-9]+ passed' | head -1 | grep -oE '[0-9]+')
            failed=$(echo "$summary" | grep -oE '[0-9]+ failed' | head -1 | grep -oE '[0-9]+')
            duration=$(echo "$summary" | grep -oE '\([0-9]+m?s\)' | tr -d '()')
            {
              echo '### ✅ Tests passed'
              echo ''
              echo '| Metric | Value |'
              echo '| --- | --- |'
              echo "| Passed   | ${passed:-?} |"
              echo "| Failed   | ${failed:-0} |"
              echo "| Duration | ${duration:-?} |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            failures=$(grep -E "FAILED|=> \./tests/" test.out | head -30)
            {
              echo '### ❌ Tests failed'
              echo ''
              echo '```'
              echo "$failures"
              echo '```'
              echo ''
              echo '<details><summary>Last 80 lines of output</summary>'
              echo ''
              echo '```'
              tail -80 test.out
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify (fmt + lint + coverage)
        id: verify
        run: |
          set -o pipefail
          if deno task verify 2>&1 | tee verify.out; then
            cov_line=$(grep -E "^(✅|❌) Coverage" verify.out | tail -1)
            # Extract "All files" row from the coverage table.
            all_files=$(grep -E "All files" verify.out | tail -1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g')
            # Pull branch | function | line percentages.
            branch=$(echo "$all_files" | awk -F'|' '{print $3}' | tr -d ' ')
            func=$(echo "$all_files"   | awk -F'|' '{print $4}' | tr -d ' ')
            line=$(echo "$all_files"   | awk -F'|' '{print $5}' | tr -d ' ')
            {
              echo '### ✅ Verify passed'
              echo ''
              echo "$cov_line"
              echo ''
              echo '| Coverage | Value |'
              echo '| --- | --- |'
              echo "| Line     | ${line:-?}% |"
              echo "| Branch   | ${branch:-?}% |"
              echo "| Function | ${func:-?}% |"
              echo ''
              echo '<details><summary>Per-file coverage table</summary>'
              echo ''
              echo '```'
              # Strip ANSI and grab the table block.
              sed 's/\x1b\[[0-9;]*[A-Za-z]//g' verify.out | grep -E "^(\| )" | head -200
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            cov_line=$(grep -E "Coverage" verify.out | tail -3)
            {
              echo '### ❌ Verify failed'
              echo ''
              if [ -n "$cov_line" ]; then
                echo '```'
                echo "$cov_line"
                echo '```'
              fi
              echo ''
              echo '<details><summary>Last 100 lines of output</summary>'
              echo ''
              echo '```'
              sed 's/\x1b\[[0-9;]*[A-Za-z]//g' verify.out | tail -100
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, lint, build, test, verify]
    steps:
      - name: Check all jobs passed
        run: |
          fmt_r='${{ needs.fmt.result }}'
          lint_r='${{ needs.lint.result }}'
          build_r='${{ needs.build.result }}'
          test_r='${{ needs.test.result }}'
          verify_r='${{ needs.verify.result }}'
          icon() {
            case "$1" in
              success)   echo '✅' ;;
              failure)   echo '❌' ;;
              cancelled) echo '⚠️' ;;
              skipped)   echo '⏭️' ;;
              *)         echo '❔' ;;
            esac
          }
          {
            echo '### CI Gate'
            echo ''
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo "| Fmt    | $(icon "$fmt_r") $fmt_r |"
            echo "| Lint   | $(icon "$lint_r") $lint_r |"
            echo "| Build  | $(icon "$build_r") $build_r |"
            echo "| Test   | $(icon "$test_r") $test_r |"
            echo "| Verify | $(icon "$verify_r") $verify_r |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '**❌ One or more CI jobs failed or were cancelled.**' >> "$GITHUB_STEP_SUMMARY"
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**✅ All CI jobs passed.**' >> "$GITHUB_STEP_SUMMARY"
          echo "All CI jobs passed"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Publish to JSR
        id: publish
        run: |
          set -o pipefail
          if deno publish 2>&1 | tee publish.out; then
            version=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' publish.out | head -1)
            {
              echo '### 🚀 Published to JSR'
              echo ''
              echo '| Field | Value |'
              echo '| --- | --- |'
              echo "| Package | \`@salmidev/dev-coach\` |"
              echo "| Version | ${version:-see logs} |"
              echo "| Commit  | \`${GITHUB_SHA:0:7}\` |"
              echo ''
              echo '🔗 https://jsr.io/@salmidev/dev-coach'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### ❌ Publish failed'
              echo ''
              echo '```'
              tail -60 publish.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
