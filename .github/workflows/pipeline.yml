name: CI

# NOTE: GitHub Actions expressions don't support string slicing, so we cannot
# trim the SHA to 7 chars at the run-name level. The UI displays the full hash;
# job-level steps that need a short SHA should compute it from $GITHUB_SHA.
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('main — {0}', github.sha) }}

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt
      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo '### ❌ Formatting drift detected' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'The following files would be modified by `deno fmt`:' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            git diff | head -200 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Summary
        if: success()
        run: |
          {
            echo '### ✅ Formatting clean'
            echo ''
            echo '`deno fmt` produced no changes.'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/lint.out"
          CLEAN="${RUNNER_TEMP:-/tmp}/lint.clean"
          if deno lint 2>&1 | tee "$LOG"; then
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN"
            footer=$(tail -1 "$CLEAN" || echo '')
            {
              echo '### ✅ Lint clean'
              echo ''
              echo "$footer"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN" || true
            {
              echo '### ❌ Lint failed'
              echo ''
              echo '```'
              cat "$CLEAN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    permissions:
      id-token: write # OIDC for Sigstore signing
      attestations: write # write provenance to the repo's attestation store
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile
        id: build
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/build.out"
          CLEAN="${RUNNER_TEMP:-/tmp}/build.clean"
          if deno task build 2>&1 | tee "$LOG"; then
            size='?'
            sha=''
            if [ -f coach ]; then
              size=$(du -h coach | cut -f1)
              sha=$(sha256sum coach | awk '{print $1}')
              echo "sha256=$sha" >> "$GITHUB_OUTPUT"
            fi
            deno_ver=$(deno --version | head -1 || echo '?')
            {
              echo '### ✅ Build succeeded'
              echo ''
              echo '| Metric | Value |'
              echo '| --- | --- |'
              echo "| Binary    | \`coach\` |"
              echo "| Platform  | linux-x86_64 |"
              echo "| Size      | $size |"
              echo "| SHA-256   | \`$sha\` |"
              echo "| Deno      | $deno_ver |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN" || true
            {
              echo '### ❌ Build failed'
              echo ''
              echo '```'
              tail -50 "$CLEAN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coach-linux-x86_64
          path: coach
          if-no-files-found: error
          retention-days: 30
      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: coach
      - name: Attestation summary
        if: success()
        run: |
          {
            echo ''
            echo '### 🔐 Build provenance attested (SLSA v1.0)'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Attestation ID | \`${{ steps.attest.outputs.attestation-id }}\` |"
            echo "| Bundle path    | \`${{ steps.attest.outputs.bundle-path }}\` |"
            echo "| Subject SHA    | \`${{ steps.build.outputs.sha256 }}\` |"
            echo "| Verify         | \`gh attestation verify coach --repo \${GITHUB_REPOSITORY}\` |"
            echo ''
            echo '🔗 [View all attestations for this repo](https://github.com/${{ github.repository }}/attestations)'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run tests
        id: test
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/test.out"
          CLEAN="${RUNNER_TEMP:-/tmp}/test.clean"
          if deno task test 2>&1 | tee "$LOG"; then
            # Strip ANSI before parsing so regexes don't have to deal with escape codes.
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN"
            # deno test summary line: "ok | N passed | M failed (Xs)"
            summary=$(grep -E "^(ok|FAILED) \|" "$CLEAN" | tail -1 || true)
            passed=$(echo "$summary" | grep -oE '[0-9]+ passed' | head -1 | grep -oE '[0-9]+' || echo '?')
            failed=$(echo "$summary" | grep -oE '[0-9]+ failed' | head -1 | grep -oE '[0-9]+' || echo '0')
            duration=$(echo "$summary" | grep -oE '\([0-9]+m?s\)' | tr -d '()' || echo '?')
            {
              echo '### ✅ Tests passed'
              echo ''
              echo '| Metric | Value |'
              echo '| --- | --- |'
              echo "| Passed   | $passed |"
              echo "| Failed   | $failed |"
              echo "| Duration | $duration |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN" || true
            failures=$(grep -E "FAILED|=> \./tests/" "$CLEAN" | head -30 || true)
            {
              echo '### ❌ Tests failed'
              echo ''
              echo '```'
              echo "$failures"
              echo '```'
              echo ''
              echo '<details><summary>Last 80 lines of output</summary>'
              echo ''
              echo '```'
              tail -80 "$CLEAN"
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify (fmt + lint + coverage)
        id: verify
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/verify.out"
          CLEAN="${RUNNER_TEMP:-/tmp}/verify.clean"
          if deno task verify 2>&1 | tee "$LOG"; then
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN"
            cov_line=$(grep -E "^(✅|❌) Coverage" "$CLEAN" | tail -1 || echo '')
            all_files=$(grep -E "All files" "$CLEAN" | tail -1 || echo '')
            branch=$(echo "$all_files" | awk -F'|' '{print $3}' | tr -d ' ' || echo '?')
            func=$(echo "$all_files"   | awk -F'|' '{print $4}' | tr -d ' ' || echo '?')
            line=$(echo "$all_files"   | awk -F'|' '{print $5}' | tr -d ' ' || echo '?')
            {
              echo '### ✅ Verify passed'
              echo ''
              if [ -n "$cov_line" ]; then echo "$cov_line"; echo ''; fi
              echo '| Coverage | Value |'
              echo '| --- | --- |'
              echo "| Line     | ${line:-?}% |"
              echo "| Branch   | ${branch:-?}% |"
              echo "| Function | ${func:-?}% |"
              echo ''
              echo '<details><summary>Per-file coverage table</summary>'
              echo ''
              echo '```'
              grep -E '^\| ' "$CLEAN" | head -200 || true
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN" || true
            cov_line=$(grep -E "Coverage" "$CLEAN" | tail -3 || true)
            {
              echo '### ❌ Verify failed'
              echo ''
              if [ -n "$cov_line" ]; then
                echo '```'
                echo "$cov_line"
                echo '```'
              fi
              echo ''
              echo '<details><summary>Last 100 lines of output</summary>'
              echo ''
              echo '```'
              tail -100 "$CLEAN"
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, lint, build, test, verify]
    steps:
      - name: Check all jobs passed
        run: |
          fmt_r='${{ needs.fmt.result }}'
          lint_r='${{ needs.lint.result }}'
          build_r='${{ needs.build.result }}'
          test_r='${{ needs.test.result }}'
          verify_r='${{ needs.verify.result }}'
          icon() {
            case "$1" in
              success)   echo '✅' ;;
              failure)   echo '❌' ;;
              cancelled) echo '⚠️' ;;
              skipped)   echo '⏭️' ;;
              *)         echo '❔' ;;
            esac
          }
          {
            echo '### CI Gate'
            echo ''
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo "| Fmt    | $(icon "$fmt_r") $fmt_r |"
            echo "| Lint   | $(icon "$lint_r") $lint_r |"
            echo "| Build  | $(icon "$build_r") $build_r |"
            echo "| Test   | $(icon "$test_r") $test_r |"
            echo "| Verify | $(icon "$verify_r") $verify_r |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '**❌ One or more CI jobs failed or were cancelled.**' >> "$GITHUB_STEP_SUMMARY"
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**✅ All CI jobs passed.**' >> "$GITHUB_STEP_SUMMARY"
          echo "All CI jobs passed"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Publish to JSR
        id: publish
        run: |
          set -o pipefail
          # Logs MUST be written outside the working tree — `deno publish`
          # rejects any untracked file inside the package root with
          # "Aborting due to uncommitted changes". Use $RUNNER_TEMP.
          LOG="${RUNNER_TEMP:-/tmp}/publish.out"
          CLEAN="${RUNNER_TEMP:-/tmp}/publish.clean"
          if deno publish 2>&1 | tee "$LOG"; then
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN"
            version=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' "$CLEAN" | head -1 || echo 'see logs')
            {
              echo '### 🚀 Published to JSR'
              echo ''
              echo '| Field | Value |'
              echo '| --- | --- |'
              echo "| Package | \`@salmidev/dev-coach\` |"
              echo "| Version | $version |"
              echo "| Commit  | \`${GITHUB_SHA:0:7}\` |"
              echo ''
              echo '🔗 https://jsr.io/@salmidev/dev-coach'
              echo ''
              echo '#### 🔐 SLSA build provenance (auto-generated by JSR)'
              echo ''
              echo 'JSR generates SLSA build provenance automatically when publishing from'
              echo 'GitHub Actions with `id-token: write`. The provenance is signed via'
              echo 'Sigstore and visible on the package page above as a verified badge.'
              echo ''
              echo 'Verify locally with:'
              echo '```bash'
              echo 'deno info jsr:@salmidev/dev-coach@'"$version"
              echo '# or open https://jsr.io/@salmidev/dev-coach/versions and click the version'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN" || true
            {
              echo '### ❌ Publish failed'
              echo ''
              echo '```'
              tail -60 "$CLEAN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
