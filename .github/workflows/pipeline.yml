name: CI

# NOTE: GitHub Actions expressions don't support string slicing, so we cannot
# trim the SHA to 7 chars at the run-name level. The UI displays the full hash;
# job-level steps that need a short SHA should compute it from $GITHUB_SHA.
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('main — {0}', github.sha) }}

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Silence Node.js 20 deprecation warnings emitted by JS-based actions
# (actions/setup-node@v4, actions/download-artifact@v8, etc.). Forces them
# to run on Node 24 today instead of waiting for the June 2026 default
# flip. See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format
        run: deno fmt
      - name: Check for changes
        id: diff
        run: |
          if git diff --exit-code; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo '### ❌ Formatting drift detected' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'The following files would be modified by `deno fmt`:' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            git diff | head -200 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Summary
        if: success()
        run: |
          {
            echo '### ✅ Formatting clean'
            echo ''
            echo '`deno fmt` produced no changes.'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/lint.out"
          CLEAN="${RUNNER_TEMP:-/tmp}/lint.clean"
          if deno lint 2>&1 | tee "$LOG"; then
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN"
            footer=$(tail -1 "$CLEAN" || echo '')
            {
              echo '### ✅ Lint clean'
              echo ''
              echo "$footer"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN" || true
            {
              echo '### ❌ Lint failed'
              echo ''
              echo '```'
              cat "$CLEAN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    permissions:
      id-token: write # OIDC for Sigstore signing
      attestations: write # write provenance to the repo's attestation store
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile
        id: build
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/build.out"
          CLEAN="${RUNNER_TEMP:-/tmp}/build.clean"
          if deno task build 2>&1 | tee "$LOG"; then
            size='?'
            sha=''
            if [ -f coach ]; then
              size=$(du -h coach | cut -f1)
              sha=$(sha256sum coach | awk '{print $1}')
              echo "sha256=$sha" >> "$GITHUB_OUTPUT"
            fi
            deno_ver=$(deno --version | head -1 || echo '?')
            {
              echo '### ✅ Build succeeded'
              echo ''
              echo '| Metric | Value |'
              echo '| --- | --- |'
              echo "| Binary    | \`coach\` |"
              echo "| Platform  | linux-x86_64 |"
              echo "| Size      | $size |"
              echo "| SHA-256   | \`$sha\` |"
              echo "| Deno      | $deno_ver |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN" || true
            {
              echo '### ❌ Build failed'
              echo ''
              echo '```'
              tail -50 "$CLEAN"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: coach-linux-x86_64
          path: coach
          if-no-files-found: error
          retention-days: 30
      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: coach
      - name: Attestation summary
        if: success()
        run: |
          {
            echo ''
            echo '### 🔐 Build provenance attested (SLSA v1.0)'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Attestation ID | \`${{ steps.attest.outputs.attestation-id }}\` |"
            echo "| Bundle path    | \`${{ steps.attest.outputs.bundle-path }}\` |"
            echo "| Subject SHA    | \`${{ steps.build.outputs.sha256 }}\` |"
            echo "| Verify         | \`gh attestation verify coach --repo \${GITHUB_REPOSITORY}\` |"
            echo ''
            echo '🔗 [View all attestations for this repo](https://github.com/${{ github.repository }}/attestations)'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run tests with coverage
        id: test
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/test.out"
          CLEAN="${RUNNER_TEMP:-/tmp}/test.clean"
          if deno task coverage:report 2>&1 | tee "$LOG"; then
            # Strip ANSI before parsing so regexes don't have to deal with escape codes.
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN"
            # deno test summary line: "ok | N passed | M failed (Xs)"
            summary=$(grep -E "^(ok|FAILED) \|" "$CLEAN" | tail -1 || true)
            passed=$(echo "$summary" | grep -oE '[0-9]+ passed' | head -1 | grep -oE '[0-9]+' || echo '?')
            failed=$(echo "$summary" | grep -oE '[0-9]+ failed' | head -1 | grep -oE '[0-9]+' || echo '0')
            duration=$(echo "$summary" | grep -oE '\([0-9]+m?s\)' | tr -d '()' || echo '?')
            {
              echo '### ✅ Tests passed (with coverage)'
              echo ''
              echo '| Metric | Value |'
              echo '| --- | --- |'
              echo "| Passed   | $passed |"
              echo "| Failed   | $failed |"
              echo "| Duration | $duration |"
              # Coverage "All files" row from the deno coverage table.
              all_files=$(grep -E "All files" "$CLEAN" | tail -1 || echo '')
              if [ -n "$all_files" ]; then
                branch=$(echo "$all_files" | awk -F'|' '{print $3}' | tr -d ' ')
                func=$(echo "$all_files"   | awk -F'|' '{print $4}' | tr -d ' ')
                line=$(echo "$all_files"   | awk -F'|' '{print $5}' | tr -d ' ')
                echo "| Branch % | ${branch}% |"
                echo "| Function % | ${func}% |"
                echo "| Line %   | ${line}% |"
              fi
              echo ''
              echo '#### Coverage breakdown (`src/`)'
              echo ''
              echo '<details><summary>Per-file coverage table</summary>'
              echo ''
              echo '```'
              grep -E '^\| ' "$CLEAN" | head -200 || true
              echo '```'
              echo '</details>'
              echo ''
              echo 'Coverage profile uploaded as artifact `deno-cov-profile` for the `verify` job to consume (no second `deno test` pass).'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN" || true
            failures=$(grep -E "FAILED|=> \./tests/" "$CLEAN" | head -30 || true)
            {
              echo '### ❌ Tests failed'
              echo ''
              echo '```'
              echo "$failures"
              echo '```'
              echo ''
              echo '<details><summary>Last 80 lines of output</summary>'
              echo ''
              echo '```'
              tail -80 "$CLEAN"
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: deno-cov-profile
          path: cov_profile
          if-no-files-found: error
          retention-days: 1

  test-bun:
    name: Test (Bun)
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    # Blocking: cross-runtime compat is now load-bearing for the JSR
    # `runtimeCompat` claim. A Bun regression should fail the gate.
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run cross-runtime suite on Bun (with coverage)
        id: bun-test
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/bun-test.out"
          bun test --coverage --coverage-reporter=lcov tests/cross-runtime/ 2>&1 | tee "$LOG"
      - name: Coverage threshold (cross-runtime preset)
        id: bun-cov
        run: |
          set -o pipefail
          LCOV='coverage/lcov.info'
          if [ ! -f "$LCOV" ]; then
            echo "::error::Bun lcov file not found at $LCOV"
            ls -la coverage/ || true
            exit 1
          fi
          OUT="${RUNNER_TEMP:-/tmp}/bun-cov.out"
          deno run --allow-read --allow-run scripts/check-coverage.ts \
            --lcov "$LCOV" --profile cross-runtime --threshold 60 2>&1 | tee "$OUT"
      - name: Summary
        if: always()
        run: |
          BLOG="${RUNNER_TEMP:-/tmp}/bun-test.out"
          COUT="${RUNNER_TEMP:-/tmp}/bun-cov.out"
          BCLEAN="${RUNNER_TEMP:-/tmp}/bun-test.clean"
          [ -f "$BLOG" ] && sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$BLOG" > "$BCLEAN" || true
          test_summary=$(grep -E "^Ran [0-9]+ tests across" "$BCLEAN" 2>/dev/null | tail -1 || echo '')
          tests_pass=$(grep -E "^ *[0-9]+ pass" "$BCLEAN" 2>/dev/null | tail -1 | tr -s ' ' || echo '')
          tests_fail=$(grep -E "^ *[0-9]+ fail" "$BCLEAN" 2>/dev/null | tail -1 | tr -s ' ' || echo '')
          {
            echo '### 🥢 Bun cross-runtime tests'
            echo ''
            echo '| Metric | Value |'
            echo '| --- | --- |'
            echo "| Bun version | $(bun --version) |"
            echo "| Tests       | ${tests_pass:-?} / ${tests_fail:-?} |"
            echo "| Run         | ${test_summary:-—} |"
            echo "| Result      | ${{ job.status }} |"
            echo ''
            echo '#### Coverage gate'
            echo ''
            if [ -f "$COUT" ]; then
              echo '```'
              cat "$COUT"
              echo '```'
            else
              echo '_Coverage step did not produce output (job likely failed earlier)._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test-node:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    # Blocking: see test-bun rationale above.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
        include:
          # Node 22: node:sqlite is gated behind --experimental-sqlite. We
          # don't pass that flag here so the import fails and the adapter
          # falls back to better-sqlite3 — exercising the fallback path.
          - node-version: '22'
            install-better-sqlite3: 'true'
            ts-flag: '--experimental-strip-types'
          # Node 24: node:sqlite is stable and TS stripping is the default.
          - node-version: '24'
            install-better-sqlite3: 'false'
            ts-flag: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install better-sqlite3 (Node 22 fallback path)
        if: matrix.install-better-sqlite3 == 'true'
        run: npm install --no-save --no-package-lock better-sqlite3
      - name: Run cross-runtime suite on Node (with coverage)
        id: node-test
        run: |
          set -o pipefail
          # Node 22 needs --experimental-strip-types to load .ts files;
          # Node 24 strips types by default. --experimental-test-coverage is
          # still the flag name on both Node 22 and Node 24.
          # node --test does not recursively discover from a bare directory
          # path — pass explicit file paths via shell glob.
          mkdir -p coverage
          shopt -s nullglob
          files=(tests/cross-runtime/*.test.ts)
          LOG="${RUNNER_TEMP:-/tmp}/node-test.out"
          node ${{ matrix.ts-flag }} \
            --experimental-test-coverage \
            --test-reporter=lcov --test-reporter-destination=coverage/node-lcov.info \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test "${files[@]}" 2>&1 | tee "$LOG"
      - name: Coverage threshold (cross-runtime preset)
        id: node-cov
        run: |
          set -o pipefail
          LCOV='coverage/node-lcov.info'
          if [ ! -f "$LCOV" ]; then
            echo "::error::Node lcov file not found at $LCOV"
            ls -la coverage/ || true
            exit 1
          fi
          OUT="${RUNNER_TEMP:-/tmp}/node-cov.out"
          deno run --allow-read --allow-run scripts/check-coverage.ts \
            --lcov "$LCOV" --profile cross-runtime --threshold 60 2>&1 | tee "$OUT"
      - name: Summary
        if: always()
        run: |
          NLOG="${RUNNER_TEMP:-/tmp}/node-test.out"
          COUT="${RUNNER_TEMP:-/tmp}/node-cov.out"
          NCLEAN="${RUNNER_TEMP:-/tmp}/node-test.clean"
          [ -f "$NLOG" ] && sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$NLOG" > "$NCLEAN" || true
          tests_pass=$(grep -E "# pass " "$NCLEAN" 2>/dev/null | tail -1 | tr -d '#' | tr -s ' ' | sed 's/^ //' || echo '')
          tests_fail=$(grep -E "# fail " "$NCLEAN" 2>/dev/null | tail -1 | tr -d '#' | tr -s ' ' | sed 's/^ //' || echo '')
          tests_dur=$(grep -E "# duration_ms " "$NCLEAN" 2>/dev/null | tail -1 | tr -d '#' | tr -s ' ' | sed 's/^ //' || echo '')
          {
            echo "### 🟢 Node ${{ matrix.node-version }} cross-runtime tests"
            echo ''
            echo '| Metric | Value |'
            echo '| --- | --- |'
            echo "| Node version | $(node --version) |"
            echo "| SQLite driver | ${{ matrix.install-better-sqlite3 == 'true' && 'better-sqlite3 (fallback)' || 'node:sqlite (built-in)' }} |"
            echo "| Tests pass   | ${tests_pass:-?} |"
            echo "| Tests fail   | ${tests_fail:-?} |"
            echo "| Duration     | ${tests_dur:-?} |"
            echo "| Result       | ${{ job.status }} |"
            echo ''
            echo '#### Coverage gate'
            echo ''
            if [ -f "$COUT" ]; then
              echo '```'
              cat "$COUT"
              echo '```'
            else
              echo '_Coverage step did not produce output (job likely failed earlier)._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Download coverage profile
        uses: actions/download-artifact@v8
        with:
          name: deno-cov-profile
          path: cov_profile
      - name: Coverage threshold check
        id: verify
        run: |
          set -o pipefail
          LOG="${RUNNER_TEMP:-/tmp}/verify.out"
          CLEAN="${RUNNER_TEMP:-/tmp}/verify.clean"
          if deno task coverage:check 2>&1 | tee "$LOG"; then
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN"
            cov_line=$(grep -E "^(✅|❌) Coverage" "$CLEAN" | tail -1 || echo '')
            {
              echo '### ✅ Verify passed'
              echo ''
              echo '#### Coverage gate (Deno, `src/` ≥ 80%)'
              echo ''
              echo '```'
              cat "$CLEAN"
              echo '```'
              echo ''
              echo 'Consumed `deno-cov-profile` artifact produced by the `test` job. No second `deno test` pass.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$LOG" > "$CLEAN" || true
            cov_line=$(grep -E "Coverage" "$CLEAN" | tail -3 || true)
            {
              echo '### ❌ Verify failed'
              echo ''
              if [ -n "$cov_line" ]; then
                echo '```'
                echo "$cov_line"
                echo '```'
              fi
              echo ''
              echo '<details><summary>Last 100 lines of output</summary>'
              echo ''
              echo '```'
              tail -100 "$CLEAN"
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, lint, build, test, test-bun, test-node, verify]
    steps:
      - name: Check all jobs passed
        run: |
          fmt_r='${{ needs.fmt.result }}'
          lint_r='${{ needs.lint.result }}'
          build_r='${{ needs.build.result }}'
          test_r='${{ needs.test.result }}'
          test_bun_r='${{ needs.test-bun.result }}'
          test_node_r='${{ needs.test-node.result }}'
          verify_r='${{ needs.verify.result }}'
          icon() {
            case "$1" in
              success)   echo '✅' ;;
              failure)   echo '❌' ;;
              cancelled) echo '⚠️' ;;
              skipped)   echo '⏭️' ;;
              *)         echo '❔' ;;
            esac
          }
          {
            echo '### CI Gate'
            echo ''
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo "| Fmt          | $(icon "$fmt_r") $fmt_r |"
            echo "| Lint         | $(icon "$lint_r") $lint_r |"
            echo "| Build        | $(icon "$build_r") $build_r |"
            echo "| Test (Deno)  | $(icon "$test_r") $test_r |"
            echo "| Test (Bun)   | $(icon "$test_bun_r") $test_bun_r |"
            echo "| Test (Node)  | $(icon "$test_node_r") $test_node_r |"
            echo "| Verify       | $(icon "$verify_r") $verify_r |"
            echo ''
            echo 'Coverage gates: Deno (≥0.80) is enforced by `Verify`; cross-runtime (≥0.60 on `src/utils/runtime/**`, `src/db/sqlite/**`, `src/utils/prompt.ts`) is enforced inside `Test (Bun)` and `Test (Node)`.'
          } >> "$GITHUB_STEP_SUMMARY"

          # All seven jobs are now blocking. Bun and Node previously had
          # continue-on-error: true under task 7.6 of
          # boost-jsr-score-and-runtime-compat; that gate was lifted once
          # the cross-runtime suite + coverage gates proved stable.
          blocking_failed='false'
          for r in "$fmt_r" "$lint_r" "$build_r" "$test_r" "$test_bun_r" "$test_node_r" "$verify_r"; do
            if [[ "$r" == 'failure' || "$r" == 'cancelled' ]]; then
              blocking_failed='true'
            fi
          done

          if [[ "$blocking_failed" == 'true' ]]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '**❌ One or more blocking CI jobs failed or were cancelled.**' >> "$GITHUB_STEP_SUMMARY"
            echo "One or more blocking CI jobs failed or were cancelled"
            exit 1
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**✅ All CI jobs passed.**' >> "$GITHUB_STEP_SUMMARY"
          echo "All blocking CI jobs passed"
